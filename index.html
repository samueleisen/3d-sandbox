<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A 3D interactive game with smooth WASD movement, orthographic camera, and real 3D depth built with Three.js.">
    <title>3D Farmland</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Wheat Field Loading Screen Overlay -->
    <div id="loading-overlay">
        <div class="loading-bg"></div>
        <div class="loading-white-tint"></div>

        <div class="loading-content">
            <div class="circle-container">
                <svg id="loading-svg-ring" width="140" height="140" viewBox="0 0 140 140">
                    <circle class="ring-bg" cx="70" cy="70" r="54" />
                    <circle class="ring-fill" cx="70" cy="70" r="54" />
                </svg>

                <div id="loading-percent">0%</div>

                <button id="btn-start-game" aria-label="Start Game">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                        <polygon points="8,5 19,12 8,19" />
                    </svg>
                </button>
            </div>

            <div id="loading-label">INITIALIZING ENGINE...</div>
        </div>
    </div>

    <div id="ui-overlay" style="padding: 8px 12px; font-size: 11px;">
        <div id="coords" style="opacity: 0.7;">x: 0 &nbsp;|&nbsp; z: 0</div>
        <div id="perf-hud" style="margin-top: 4px; border-top: 1px solid rgba(200, 255, 200, 0.15); padding-top: 4px;">
            <div>FPS: <span class="perf-fps" style="color:#5cf0a0; font-weight:bold;">--</span> &nbsp;|&nbsp; Avg: <span
                    class="perf-avg">--</span></div>
        </div>
    </div>

    <!-- Pure CSS Camera Panel Toggle Button (Off By Default) -->
    <input type="checkbox" id="toggle-camera-panel" class="panel-toggle-check">
    <label for="toggle-camera-panel" class="panel-toggle-btn" title="Toggle Camera Panel">⚙️</label>

    <div id="camera-panel">
        <h3>Camera Controls</h3>

        <div class="control-group">
            <label>Tilt Angle: <span id="val-tilt" class="control-value">75°</span></label>
            <input type="range" id="ctrl-tilt" min="5" max="135" value="75">
        </div>

        <div class="control-group">
            <label>Horizontal Yaw: <span id="val-yaw" class="control-value">180°</span></label>
            <input type="range" id="ctrl-yaw" min="0" max="360" value="180">
        </div>

        <div class="control-group" id="group-fov">
            <label>Field of View: <span id="val-fov" class="control-value">50°</span></label>
            <input type="range" id="ctrl-fov" min="20" max="100" value="50">
        </div>



        <div class="control-group">
            <label>Grass Density</label>
            <select id="ctrl-grass-density">
                <option value="40000" selected>Rock-Solid Horizon</option>
                <option value="25000">Dense Horizon</option>
            </select>
        </div>

        <div class="control-group" style="border-top: 1px solid rgba(200, 255, 200, 0.15); padding-top: 8px;">
            <label>Ambient Wind SFX: <span id="wind-audio-status" style="color: #ffb050; float: right;">Click to
                    enable</span></label>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                <input type="range" id="ctrl-wind-vol" min="0" max="1" step="0.05" value="0.05" style="flex: 1;">
                <span id="val-wind-vol" class="control-value" style="min-width: 35px; text-align: right;">5%</span>
            </div>
            <label
                style="display: flex; align-items: center; gap: 8px; margin-top: 6px; cursor: pointer; user-select: none;">
                <input type="checkbox" id="ctrl-wind-mute" style="width: auto; cursor: pointer;">
                Mute Wind SFX
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>


    <!-- Translucent Mobile Joystick Overlay -->
    <div id="touch-joystick">
        <div id="touch-joystick-knob"></div>
    </div>

    <script src="js/Sams.js"></script>
    <script src="js/Owns.js"></script>

    <!-- Translucent Dynamic Mobile Joystick & Camera Touch Drag Script -->
    <script>
        (function () {
            let joyTouchId = null;
            let camTouchId = null;
            let startX = 0, startY = 0;
            let camPrevX = 0, camPrevY = 0;
            const DEADZONE = 12;
            const MAX_RADIUS = 40;

            const joystickEl = document.getElementById('touch-joystick');
            const knobEl = document.getElementById('touch-joystick-knob');

            function updateKeys(dx, dy) {
                if (typeof keys === 'undefined') return;
                keys.w = dy < -DEADZONE;
                keys.s = dy > DEADZONE;
                keys.a = dx < -DEADZONE;
                keys.d = dx > DEADZONE;
            }

            function resetKeys() {
                if (typeof keys === 'undefined') return;
                keys.w = keys.a = keys.s = keys.d = false;
            }

            window.addEventListener('touchstart', function (e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.target && touch.target.closest && (
                        touch.target.closest('#camera-panel') ||
                        touch.target.closest('#ui-overlay') ||
                        touch.target.closest('#loading-overlay') ||
                        touch.target.closest('.panel-toggle-btn')
                    )) {
                        continue;
                    }

                    if (touch.clientX < window.innerWidth * 0.5 && joyTouchId === null) {
                        joyTouchId = touch.identifier;
                        startX = touch.clientX;
                        startY = touch.clientY;

                        if (joystickEl) {
                            joystickEl.style.left = startX + 'px';
                            joystickEl.style.top = startY + 'px';
                            joystickEl.classList.add('active');
                        }
                        if (knobEl) {
                            knobEl.style.transform = 'translate(-50%, -50%)';
                        }
                    } else if (touch.clientX >= window.innerWidth * 0.5 && camTouchId === null) {
                        camTouchId = touch.identifier;
                        camPrevX = touch.clientX;
                        camPrevY = touch.clientY;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', function (e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joyTouchId) {
                        const dx = touch.clientX - startX;
                        const dy = touch.clientY - startY;
                        updateKeys(dx, dy);

                        if (knobEl) {
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            const angle = Math.atan2(dy, dx);
                            const clampedDist = Math.min(dist, MAX_RADIUS);
                            const knobX = Math.cos(angle) * clampedDist;
                            const knobY = Math.sin(angle) * clampedDist;
                            knobEl.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;
                        }
                    } else if (touch.identifier === camTouchId) {
                        const dx = touch.clientX - camPrevX;
                        const dy = touch.clientY - camPrevY;
                        camPrevX = touch.clientX;
                        camPrevY = touch.clientY;

                        if (typeof camYawDeg !== 'undefined') {
                            camYawDeg = (camYawDeg - dx * 0.35) % 360;
                            if (camYawDeg < 0) camYawDeg += 360;
                        }
                        if (typeof camAngleDeg !== 'undefined') {
                            camAngleDeg = Math.min(135, Math.max(5, camAngleDeg - dy * 0.25));
                        }
                        if (typeof updateUISliders === 'function') {
                            updateUISliders();
                        }
                    }
                }
            }, { passive: false });

            function handleTouchEnd(e) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joyTouchId) {
                        joyTouchId = null;
                        resetKeys();
                        if (joystickEl) {
                            joystickEl.classList.remove('active');
                        }
                        if (knobEl) {
                            knobEl.style.transform = 'translate(-50%, -50%)';
                        }
                    } else if (touch.identifier === camTouchId) {
                        camTouchId = null;
                    }
                }
            }

            window.addEventListener('touchend', handleTouchEnd);
            window.addEventListener('touchcancel', handleTouchEnd);
        })();
    </script>
</body>

</html>
