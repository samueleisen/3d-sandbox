<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A 3D interactive game with smooth WASD movement, orthographic camera, and real 3D depth built with Three.js.">
    <title>3D Farmland</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="ui-overlay">
        <div id="perf-hud" style="pointer-events: auto;">
            FPS: <span class="perf-fps" style="color:#5cf0a0; font-weight:bold;">--</span>
        </div>
        <div id="coords" style="margin-top: 4px; opacity: 0.8;">x: 0 &nbsp; z: 0</div>
    </div>

    <div id="camera-panel">
        <h3>Camera Controls</h3>

        <div class="control-group">
            <label>Camera Projection</label>
            <select id="ctrl-type">
                <option value="persp" selected>Perspective (Real Depth)</option>
                <option value="ortho">Orthographic (Flat 2D)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Tilt Angle: <span id="val-tilt" class="control-value">75°</span></label>
            <input type="range" id="ctrl-tilt" min="5" max="135" value="75">
        </div>

        <div class="control-group">
            <label>Horizontal Yaw: <span id="val-yaw" class="control-value">180°</span></label>
            <input type="range" id="ctrl-yaw" min="0" max="360" value="180">
        </div>

        <div class="control-group">
            <label>Camera Height: <span id="val-height" class="control-value">150</span></label>
            <input type="range" id="ctrl-height" min="150" max="900" value="150">
        </div>

        <div class="control-group" id="group-fov">
            <label>Field of View: <span id="val-fov" class="control-value">50°</span></label>
            <input type="range" id="ctrl-fov" min="20" max="100" value="50">
        </div>

        <div class="control-group" id="group-size" style="display: none;">
            <label>Ortho View Size: <span id="val-size" class="control-value">420</span></label>
            <input type="range" id="ctrl-size" min="150" max="800" value="420">
        </div>



        <div class="control-group">
            <label>Render Quality (Resolution Scale)</label>
            <select id="ctrl-render-scale">
                <option value="1.0" selected>100% Native (1.0x)</option>
                <option value="0.75">75% Balanced (0.75x)</option>
                <option value="0.50">50% Performance (0.50x)</option>
            </select>
        </div>

        <div class="control-group">
            <label>Grass Density</label>
            <select id="ctrl-grass-density">
                <option value="80000">Rock-Solid Horizon (80,000 blades)</option>
                <option value="40000">Dense Horizon (40,000 blades)</option>
                <option value="25000">Dense Horizon (25,000 blades)</option>
                <option value="10000">Far Horizon (10,000 blades)</option>
                <option value="0">Off (Disabled)</option>
            </select>
        </div>

        <div class="control-group" style="border-top: 1px solid rgba(200, 255, 200, 0.15); padding-top: 8px;">
            <label>Ambient Wind SFX: <span id="wind-audio-status" style="color: #ffb050; float: right;">Click to
                    enable</span></label>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                <input type="range" id="ctrl-wind-vol" min="0" max="1" step="0.05" value="0.10" style="flex: 1;">
                <span id="val-wind-vol" class="control-value" style="min-width: 35px; text-align: right;">10%</span>
            </div>
            <label
                style="display: flex; align-items: center; gap: 8px; margin-top: 6px; cursor: pointer; user-select: none;">
                <input type="checkbox" id="ctrl-wind-mute" style="width: auto; cursor: pointer;">
                Mute Wind SFX
            </label>
        </div>

        <div class="control-group" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;">
                <input type="checkbox" id="ctrl-fov-lines" style="width: auto; cursor: pointer;">
                Show FOV Vision Boundary Lines
            </label>
        </div>

        <div class="control-group">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;">
                <input type="checkbox" id="ctrl-shadow-helper" style="width: auto; cursor: pointer;">
                Show Shadow Camera Frustum Debug
            </label>
        </div>

        <div class="control-group">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;">
                <input type="checkbox" id="ctrl-light-helper" style="width: auto; cursor: pointer;">
                Show Light Ray & Discrete Step Helper
            </label>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- Foundation -->
    <script src="js/constants.js"></script>
    <script src="js/perfBuffer.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/horizonSink.js"></script>

    <!-- World & Landscape -->
    <script src="js/world.js"></script>
    <script src="js/grass.js"></script>
    <script src="js/sky.js"></script>
    <script src="js/cameraFOVHelper.js"></script>
    <script src="js/lightHelper.js"></script>

    <!-- Character & Systems -->
    <script src="js/player.js"></script>
    <script src="js/ponytailPhysics.js"></script>
    <script src="js/input.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/playerController.js"></script>
    <script src="js/camera.js"></script>

    <!-- Game Loop -->
    <script src="js/loop.js"></script>
</body>

</html>
